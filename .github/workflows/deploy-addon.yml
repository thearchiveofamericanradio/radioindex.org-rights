name: Deploy bundled rights Worker

on:
  push:
    branches: [main]
    paths:
      - "addon/**"
      - "rights/**"
      - "manifest.json"
      - ".github/workflows/deploy-addon.yml"
  workflow_dispatch:

concurrency:
  group: deploy-addon-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pack bundled rights JSON
        run: node scripts/pack-assets.mjs

      - name: Deploy Worker
        working-directory: addon
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
